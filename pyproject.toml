[tool.poetry]
name = "rag-app"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) application leveraging Langchain for natural language processing and deployed on AWS, designed to provide efficient and scalable AI-driven solutions."
authors = ["Eshaan S N <eshaansn@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langchain = "0.3.23"
mangum = "0.17.0"
uvicorn = "0.30.0"
pypdf = "4.2.0"
chromadb = "0.5.0"
langchain-community = "0.3.21"
hydra-core = "~1.3"
pydantic = ">=2.10.0,<3.0.0"
langchain-chroma = "0.2.2"
langchain-core = "0.3.51"
langchain-huggingface = "0.1.2"
langchain-text-splitters = "0.3.8"
langsmith = "0.3.24"
transformers = ">=4.33.0"
sentence-transformers = ">=2.6.0"
langchain-openai = "0.3.12"
langchain-aws = "0.2.18"
accelerate = '1.6.0' 
psutil = '7.0.0'

[build-system]
requires = ["poetry-core~2.0"]
build-backend = "poetry.core.masonry.api"

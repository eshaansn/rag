services:
  app:
    env_file:
      - .env
    user: "${USER_ID:-1000}"
    hostname: "${HOST_NAME:-eshaansn}"
    image: rag-app
    platform: linux/amd64
    container_name: rag-app-container
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        USER_NAME: "${USER_NAME:-eshaansn}"
        USER_ID: "${USER_ID:-1000}"
    # volumes:
    #   - ./:/app/
    ports:
      - 8000:8000

    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ipc: host
    init: true


  